<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Event</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>📝 Create a New Event</h1>
    <form id="eventForm">
      <input type="text" id="name" placeholder="Event Name" required />
      <input type="text" id="date" placeholder="Event Date (YYYY-MM-DD)" required />
      <input type="text" id="location" placeholder="Event Location" required />
      <button type="submit">Create Event</button>
    </form>
    <p id="message"></p>
    <a href="index.html" class="btn">← Back to Events</a>
  </div>
  <script>
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const date = document.getElementById('date').value;
      const location = document.getElementById('location').value;
      const response = await fetch('AWS_API_GATEWAY_URL', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, date, location })
      });
      const result = await response.json();
      document.getElementById('message').innerText = result;
    });
  </script>
</body>
</html>
