<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upcoming Events 🎉</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🌟 Upcoming Events</h1>
    <div id="events" class="card-container"></div>

    <div class="nav-links">
      <a href="subscribe.html" class="btn">📬 Subscribe</a>
      <a href="create-event.html" class="btn">📝 Create Event</a>
    </div>
  </div>

  <script>
    async function loadEvents() {
      try {
        const response = await fetch('events.json');
        const events = await response.json();
        const eventsDiv = document.getElementById('events');

        if (events.length === 0) {
          eventsDiv.innerHTML = "<p>No events available yet.</p>";
          return;
        }

        events.forEach(event => {
          const eventItem = document.createElement('div');
          eventItem.className = "card";
          eventItem.innerHTML = `
            <h2>${event.name}</h2>
            <p><strong>Date:</strong> ${event.date}</p>
            <p><strong>Location:</strong> ${event.location}</p>
          `;
          eventsDiv.appendChild(eventItem);
        });
      } catch (err) {
        document.getElementById('events').innerHTML = "<p>Failed to load events.</p>";
        console.error("Error:", err);
      }
    }

    loadEvents();
  </script>
</body>
</html>
